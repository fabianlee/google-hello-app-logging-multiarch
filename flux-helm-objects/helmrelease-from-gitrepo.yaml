apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-hello-helm
  #namespace: github-hello-helm
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: ./charts/google-hello-app-logging-multiarch
      version: '0.0.*'
      sourceRef:
        kind: GitRepository
        name: github-hello-git-repo
  releaseName: google-hello-app-logging-multiarch # using default would prepend '<ns>-'
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    replicaCount: 2
    extraEnvVars:
      - name: whoami
        value: "using src with patch version 0.0.*" # message added as env var
