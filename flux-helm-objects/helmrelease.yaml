apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-hello-helm
  #namespace: github-hello-helm
spec:
  interval: 1m
  timeout: 3m
  chart:
    spec:
      chart: google-hello-app-logging-multiarch
      version: '0.0.*'
      sourceRef:
        kind: HelmRepository
        name: github-hello-helm-repo
      interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    replicaCount: 2
